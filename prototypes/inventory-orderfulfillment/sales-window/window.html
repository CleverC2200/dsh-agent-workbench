<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>正在加载订单</title>
  <style>
    .editor-submission-status {
      display: block;
      padding: 8px 16px;
      color: #247338;
      background: #f0f9eb;
      border-radius: 6px;
    }
    [hidden] {
      display: none !important;
    }
    body {
      margin: 0;
      background: #f5f6f7;
      color: #34383e;
      font:
        16px/1.7 system-ui,
        sans-serif;
    }
    main {
      max-width: 700px;
      margin: 24px auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 18px;
    }
    #summary {
      white-space: pre-line;
      color: #555;
    }
    article {
      padding: 16px 0;
      border-bottom: 1px solid #e5e6eb;
    }
    article p {
      margin: 4px 0;
      color: #666;
    }
    .order-list-reason {
      white-space: pre-line;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
      border-top: 1px solid #e5e6eb;
      padding-top: 18px;
    }
    #process,
    button,
    select {
      font: inherit;
      border: 1px solid #c9cdd4;
      border-radius: 8px;
      background: white;
      padding: 8px 20px;
    }
    button {
      cursor: pointer;
    }
    button.primary {
      color: #fff;
      background: #245bdb;
      border-color: #245bdb;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #notice {
      color: #d33;
      min-height: 1.7em;
    }
    #result {
      padding: 12px;
      background: #f0f7ff;
      color: #245bdb;
    }
    small {
      color: #86909c;
    }
    label {
      display: block;
      margin: 18px 0;
    }
    #quantity {
      font-weight: 600;
    }
    @media (max-width: 500px) {
      main {
        margin: 0;
        padding: 20px;
        border-radius: 0;
      }
      .actions button {
        flex: 1;
        min-width: 0;
      }
      select {
        width: 100%;
        margin-top: 8px;
      }
    }
  </style>
  <main id="windowLoading" role="status" aria-live="polite">
    <h1>正在加载订单…</h1>
    <p>正在读取订单信息，请稍候。</p>
  </main>
  <main id="confirmationMain" hidden>
    <p id="title" hidden></p>
    <p id="summary"></p>
    <section id="items" hidden></section>
    <div id="defer" hidden>
      <span>预计交货日期</span>
      <input id="days" type="date" aria-label="预计交货日期" hidden />
      <button
        id="deferDateTrigger"
        type="button"
        aria-label="选择预计交货日期"
        aria-haspopup="dialog"
        aria-expanded="false"
        disabled
      >
        <span id="deferDateValue">选择日期</span>
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M5 4h14a1 1 0 0 1 1 1v15H4V5a1 1 0 0 1 1-1ZM8 2v5M16 2v5M4 10h16" />
        </svg>
      </button>
    </div>
    <p id="quantity"></p>
    <p id="notice" role="alert"></p>
    <p id="result" role="status" hidden></p>
    <nav id="pages" hidden>
      <button id="previous">上一页</button> <span id="pageLabel"></span>
      <button id="next">下一页</button>
    </nav>
    <div class="actions">
      <button id="cancel">返回</button><a id="process" hidden>订单处理</a
      ><button class="primary" id="submit" disabled>确认</button>
    </div>
  </main>

  <div id="deferDatePicker" hidden>
    <section aria-labelledby="deferDateTitle">
      <h2 id="deferDateTitle">选择预计交货日期</h2>
      <div class="defer-calendar-header">
        <button id="deferMonthPrevious" type="button" aria-label="上个月">‹</button>
        <h3 id="deferCalendarMonth" aria-live="polite"></h3>
        <button id="deferMonthNext" type="button" aria-label="下个月">›</button>
      </div>
      <div class="defer-calendar-week" aria-hidden="true">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span
        ><span>六</span>
      </div>
      <div id="deferCalendarDays" role="group" aria-label="日期"></div>
      <button id="deferDateConfirm" class="primary" type="button">确认</button>
    </section>
  </div>

  <main id="orderEditor" hidden aria-label="订单履约"></main>
  <style>
    #orderEditor {
      width: min(760px, calc(100% - 32px));
      height: calc(100dvh - 16px);
      max-height: 1000px;
      max-width: 760px;
      margin: 8px auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 24px #1f29370a;
    }
    #orderEditor * {
      box-sizing: border-box;
    }
    #orderEditor header {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      align-items: center;
      min-height: 40px;
      padding: 0 12px;
      background: #f4f4f5;
      border-bottom: 1px solid #eceef0;
      flex-shrink: 0;
    }
    #orderEditor h1 {
      margin: 0;
      text-align: center;
      font-size: 20px;
      font-weight: 650;
    }
    #orderEditor button {
      font: inherit;
      font-size: 14px;
      padding: 7px 12px;
      border: 1px solid #e8e8eb;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }
    #orderEditor button:disabled {
      cursor: not-allowed;
    }
    #orderEditor button:focus-visible,
    #orderEditor input:focus-visible,
    #orderEditor select:focus-visible {
      outline: 2px solid #ed2232;
      outline-offset: 2px;
    }
    #orderEditor .editor-back,
    #orderEditor .editor-cart {
      border: 0;
      background: transparent;
      padding: 8px 0;
      text-align: left;
      color: #60646c;
    }
    #orderEditor .editor-cart {
      text-align: right;
      font-size: 12px;
    }
    #orderEditor .editor-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
    }
    #orderEditor .editor-back svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #orderEditor .editor-visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    #orderEditor .editor-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #orderEditor .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid #efeff1;
      flex-shrink: 0;
    }
    #orderEditor .editor-toolbar > span {
      flex: 1;
      white-space: nowrap;
      font-size: 15px;
    }
    #orderEditor .editor-toolbar label {
      margin: 0;
    }
    #orderEditor .editor-vehicle select {
      max-width: 190px;
      padding: 6px;
      border: 0;
      background: white;
      color: #9c9fa6;
      font-size: 13px;
    }
    #orderEditor .editor-remove {
      position: absolute;
      top: 12px;
      right: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 8px;
      border: 0;
      background: transparent;
      color: #858b93;
      cursor: pointer;
    }
    #orderEditor .editor-remove svg {
      width: 22px;
      height: 22px;
    }
    #orderEditor .editor-remove:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
      border-radius: 4px;
    }
    #orderEditor .editor-add {
      margin-left: auto;
      align-self: center;
      border: 0;
      padding: 6px 0;
      color: #ed2232;
      font-weight: 600;
      white-space: nowrap;
    }
    #orderEditor .editor-order-products {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }
    #orderEditor .editor-products {
      min-width: 0;
    }
    #orderEditor article {
      position: relative;
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 20px;
      padding: 20px 24px;
      border-bottom: 1px solid #efeff1;
      margin: 0;
    }
    #orderEditor .editor-image {
      position: relative;
      width: 108px;
      height: 122px;
      align-self: start;
      overflow: hidden;
      background: #f5f5f6;
      border: 1px solid #e9e9ec;
      border-radius: 7px;
    }
    #orderEditor .editor-image:before {
      content: '';
      position: absolute;
      left: 22%;
      top: 34%;
      width: 54%;
      height: 38%;
      background: #dedfe3;
      clip-path: polygon(0 100%, 36% 16%, 61% 67%, 77% 40%, 100% 100%);
    }
    #orderEditor .editor-image:after {
      content: '';
      position: absolute;
      top: 21%;
      right: 22%;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #dedfe3;
    }
    #orderEditor .editor-image span {
      position: absolute;
      bottom: 7px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: #9c9fa6;
    }
    #orderEditor .editor-item-info {
      min-width: 0;
    }
    #orderEditor .editor-product-name {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      color: #29313c;
      font-size: 16px;
      line-height: 1.6;
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    #orderEditor .editor-has-remove .editor-product-name {
      padding-right: 44px;
    }
    #orderEditor article .editor-spec {
      margin: 4px 0 0;
      color: #9b9ea5;
      font-size: 13px;
    }
    #orderEditor .editor-sku,
    #orderEditor .editor-original {
      display: block;
      color: #a2a5ac;
      font-size: 11px;
      line-height: 1.6;
    }
    #orderEditor .editor-product-trading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
    }
    #orderEditor .editor-price {
      flex: 1 1 0;
      min-width: 0;
    }
    #orderEditor .editor-price strong {
      display: block;
      font-size: 17px;
      font-weight: 650;
      color: #252b32;
    }
    #orderEditor .editor-price small {
      display: block;
      font-size: 10px;
      color: #a2a5ac;
    }
    #orderEditor .editor-price .editor-price-warning {
      color: #ed2232;
      display: block;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border: 0;
      padding: 0;
      background: transparent;
      font-size: 10px;
      line-height: 1.5;
      text-align: left;
    }
    #orderEditor .editor-quantity {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      margin-left: auto;
    }
    #orderEditor .editor-quantity button {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 5px 0 0 5px;
      color: #343a44;
      font-size: 18px;
    }
    #orderEditor .editor-quantity button:last-of-type {
      border-radius: 0 5px 5px 0;
    }
    #orderEditor .editor-quantity button:disabled {
      color: #c6c9d0;
      background: #fafafa;
    }
    #orderEditor input[type='number'] {
      width: 48px;
      height: 32px;
      padding: 0 3px;
      border: 1px solid #e8e8eb;
      border-left: 0;
      border-right: 0;
      border-radius: 0;
      text-align: center;
      font: inherit;
      font-size: 14px;
      appearance: textfield;
      background: white;
    }
    #orderEditor input[type='number']::-webkit-inner-spin-button,
    #orderEditor input[type='number']::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    #orderEditor .editor-quantity > span {
      margin-left: 7px;
      font-size: 11px;
      color: #9b9ea5;
    }
    #orderEditor article .editor-stock-warning {
      text-align: right;
      margin: 7px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: #ed2232;
    }
    #orderEditor .editor-original {
      margin-top: 4px;
    }
    #orderEditor .editor-delivery-info {
      padding: 12px 24px 4px;
      color: #9b9ea5;
      font-size: 12px;
      flex-shrink: 0;
    }
    #orderEditor .editor-delivery-info p {
      margin: 3px 0;
      overflow-wrap: anywhere;
    }
    #orderEditor .editor-disclosure {
      padding: 7px 24px 10px;
      color: #989ca5;
      font-size: 11px;
      flex-shrink: 0;
      max-height: 120px;
      overflow: auto;
    }
    #orderEditor .editor-disclosure summary {
      cursor: pointer;
    }
    #orderEditor .editor-disclosure[open] {
      max-height: min(280px, 40dvh);
    }
    #orderEditor .editor-disclosure .editor-basic-info {
      padding: 10px 0 6px;
    }
    #orderEditor header .editor-header-add {
      justify-self: end;
      margin: 0;
      white-space: nowrap;
      background: transparent;
    }
    #orderEditor .editor-disclosure p {
      margin: 5px 0;
      line-height: 1.7;
    }
    #orderEditor .editor-warning {
      color: #ba493e;
      font-size: 12px;
      margin: 8px 24px;
    }
    #orderEditor .editor-disclosure .editor-warning {
      margin: 5px 0;
    }
    #orderEditor footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
      flex-shrink: 0;
      background: white;
      padding: 14px 24px 10px;
      border-top: 1px solid #e9e9ec;
      box-shadow: 0 -3px 12px #1f293705;
    }
    #orderEditor .editor-totals {
      min-width: 0;
      flex: 1;
    }
    #orderEditor .editor-totals > strong {
      font-size: 13px;
      font-weight: 600;
    }
    #orderEditor .editor-rate {
      color: #ed2232;
      font-size: 11px;
      margin: 3px 0;
    }
    #orderEditor .editor-order-number {
      color: #92969f;
      font-size: 10px;
      margin: 3px 0 0;
      overflow-wrap: anywhere;
    }
    #orderEditor[data-page='catalog'] .editor-rate,
    #orderEditor[data-page='catalog'] .editor-order-number {
      display: none;
    }
    #orderEditor .editor-checkout {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #orderEditor .editor-amount {
      font-size: 15px;
      color: #393e46;
      white-space: nowrap;
    }
    #orderEditor .editor-primary {
      min-height: 42px;
      padding: 9px 17px;
      color: white;
      background: #ed2232;
      border-color: #ed2232;
      font-weight: 600;
    }
    #orderEditor .editor-primary:disabled {
      color: white;
      background: #ee979f;
      border-color: #ee979f;
    }
    #orderEditor .editor-draft-note {
      width: 100%;
      margin: 0;
      color: #a0a4ad;
      font-size: 10px;
      line-height: 1.6;
    }
    #orderEditor .editor-search-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 16px 20px 8px;
      flex-shrink: 0;
    }
    #orderEditor .editor-search-field {
      display: flex;
      align-items: center;
      flex: 1 1 180px;
      min-width: 0;
      padding: 0 14px;
      border: 1px solid #e9e9ec;
      border-radius: 10px;
      min-height: 42px;
      flex-shrink: 0;
    }
    #orderEditor .editor-catalog-action {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid #ed2232;
      border-radius: 8px;
      background: #fff;
      color: #ed2232;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    #orderEditor .editor-catalog-action:disabled {
      border-color: #d9dce2;
      color: #9298a3;
      cursor: default;
    }
    #orderEditor .editor-search-icon {
      color: #a3a7af;
      font-size: 24px;
      margin-right: 10px;
    }
    #orderEditor .editor-search {
      width: 100%;
      min-width: 0;
      font: inherit;
      font-size: 14px;
      border: 0;
      outline: none;
      background: transparent;
      padding: 10px 0;
    }
    #orderEditor .editor-category-tabs {
      display: flex;
      gap: 24px;
      overflow-x: auto;
      flex-shrink: 0;
      padding: 0 20px;
      border-bottom: 1px solid #ededf0;
    }
    #orderEditor .editor-category-tabs button {
      padding: 12px 2px;
      border: 0;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      white-space: nowrap;
      font-weight: 600;
    }
    #orderEditor .editor-category-tabs button[aria-pressed='true'] {
      color: #ed2232;
      border-bottom-color: #ed2232;
    }
    #orderEditor .editor-catalog {
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr);
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    #orderEditor .editor-subcategories {
      min-height: 0;
      overflow-y: auto;
      background: #f5f5f6;
    }
    #orderEditor .editor-subcategories button {
      width: 100%;
      padding: 19px 8px;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 0;
      font-size: 13px;
      background: transparent;
      color: #626772;
      overflow-wrap: anywhere;
    }
    #orderEditor .editor-subcategory-label {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }
    #orderEditor .editor-subcategories button[aria-pressed='true'] {
      background: white;
      color: #ed2232;
      border-left-color: #ed2232;
    }
    #orderEditor .editor-catalog .editor-products {
      overflow-y: auto;
      min-height: 0;
    }
    #orderEditor .editor-catalog article {
      grid-template-columns: 94px minmax(0, 1fr);
      gap: 14px;
      padding: 18px 16px;
    }
    #orderEditor .editor-catalog .editor-image {
      width: 94px;
      height: 110px;
    }
    #orderEditor .editor-empty {
      padding: 32px 18px;
      text-align: center;
      color: #a2a5ac;
      font-size: 13px;
    }
    @media (max-width: 520px) {
      #orderEditor {
        width: 100%;
        height: 100dvh;
        max-height: none;
        margin: 0;
        border-radius: 0;
      }
      #orderEditor header {
        grid-template-columns: 44px minmax(0, 1fr) auto;
        padding: 0 8px;
        min-height: 44px;
      }
      #orderEditor .editor-back {
        width: 44px;
        height: 44px;
      }
      #orderEditor h1 {
        font-size: 18px;
      }
      #orderEditor .editor-toolbar {
        gap: 10px;
        padding: 13px 14px;
      }
      #orderEditor .editor-toolbar > span {
        font-size: 12px;
      }
      #orderEditor .editor-vehicle select {
        max-width: 140px;
        font-size: 11px;
      }
      #orderEditor .editor-add {
        font-size: 13px;
      }
      #orderEditor article {
        grid-template-columns: 80px minmax(0, 1fr);
        gap: 13px;
        padding: 16px 14px;
      }
      #orderEditor .editor-image {
        width: 80px;
        height: 100px;
      }
      #orderEditor .editor-product-name {
        font-size: 14px;
      }
      #orderEditor .editor-product-trading {
        gap: 6px;
        margin-top: 12px;
      }
      #orderEditor .editor-quantity button {
        width: 27px;
        height: 30px;
      }
      #orderEditor input[type='number'] {
        width: 38px;
        height: 30px;
      }
      #orderEditor .editor-price strong {
        font-size: 15px;
      }
      #orderEditor .editor-quantity > span {
        margin-left: 4px;
      }
      #orderEditor .editor-delivery-info,
      #orderEditor .editor-disclosure {
        padding-left: 14px;
        padding-right: 14px;
      }
      #orderEditor footer {
        padding: 11px 14px 8px;
        gap: 8px;
      }
      #orderEditor .editor-totals > strong {
        font-size: 11px;
      }
      #orderEditor .editor-checkout {
        gap: 8px;
      }
      #orderEditor .editor-primary {
        padding: 8px 11px;
        font-size: 12px;
      }
      #orderEditor .editor-amount {
        font-size: 12px;
      }
      #orderEditor .editor-catalog {
        grid-template-columns: 76px minmax(0, 1fr);
      }
      #orderEditor .editor-catalog article {
        grid-template-columns: 66px minmax(0, 1fr);
        gap: 10px;
        padding: 14px 10px;
      }
      #orderEditor .editor-catalog .editor-image {
        width: 66px;
        height: 85px;
      }
      #orderEditor .editor-catalog .editor-product-name {
        font-size: 13px;
      }
      #orderEditor .editor-search-bar {
        margin: 12px 14px 6px;
      }
      #orderEditor .editor-search-field {
        flex-basis: 100%;
      }
      #orderEditor .editor-catalog-action {
        flex: 1 1 0;
      }
      #orderEditor .editor-category-tabs {
        gap: 20px;
        padding: 0 14px;
      }
    }
    #orderEditor .editor-basic-info {
      padding: 12px 24px;
      color: #858b95;
      font-size: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid #eceef0;
    }
    #orderEditor .editor-basic-info h2 {
      margin: 0 0 12px;
      font-size: 15px;
