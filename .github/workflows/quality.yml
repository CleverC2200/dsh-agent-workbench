name: candidate-quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: candidate-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-scope:
    runs-on: ubuntu-latest
    outputs:
      cores: ${{ steps.cores.outputs.cores }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require supported same-repository event
        env:
          QUALITY_SCOPE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: node scripts/run-quality-ci.mjs --phase scope
      - name: Require explicit peer contents-read credential
        env:
          PEER_READ_TOKEN: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
        run: |
          node -e "if (!process.env.PEER_READ_TOKEN) throw Error('CANDIDATE_PEER_REQUIRED: configure peer contents-read token')"
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/dsh-gea-plugin
          ref: 0a7663db00657541bbda297a3fa702d6ed285b26
          path: candidate/dsh-gea-plugin
          fetch-depth: 0
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - name: Read Core matrix from the registered authority
        id: cores
        run: node --input-type=module -e 'import fs from "node:fs"; const cores = JSON.parse(fs.readFileSync("candidate/dsh-gea-plugin/scripts/supported-cores.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "cores=" + JSON.stringify(cores.map(core => core.head)) + "\n")'

  gates:
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(needs.candidate-scope.outputs.cores) }}
    needs: candidate-scope
    runs-on: ubuntu-latest
    env:
      QUALITY_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QUALITY_CANDIDATE: ${{ github.workspace }}/candidate-input.json
    defaults:
      run:
        working-directory: candidate/dsh-agent-workbench
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: candidate/dsh-agent-workbench
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require explicit peer contents-read credential
        env:
          PEER_READ_TOKEN: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
        run: |
          node -e "if (!process.env.PEER_READ_TOKEN) throw Error('CANDIDATE_PEER_REQUIRED: configure peer contents-read token')"
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/dsh-agent-manage
          ref: 399bf00728e7408519286e8cd7ad359367eda323
          fetch-depth: 0
          path: candidate/dsh-agent-manage
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/dsh-gea-plugin
          ref: 0a7663db00657541bbda297a3fa702d6ed285b26
          fetch-depth: 0
          path: candidate/dsh-gea-plugin
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - name: Enable declared package managers
        run: |
          npm install --global npm@11.11.0
          corepack enable
      - name: Bind actual event and frozen peers
        run: node scripts/run-quality-ci.mjs --phase input --root "${{ github.workspace }}" --sha "${{ env.QUALITY_EXPECTED_SHA }}" --core-head "${{ matrix.core }}"
      - name: Prepare independent SDK and run public quality gates
        run: npm run quality:ci -- --prepare-sdk --core-source https://github.com/deepseek-ai/deepseek-harness.git --core-head "${{ matrix.core }}" --browser --prepare-browser

  candidate-quality:
    if: always()
    needs: [candidate-scope, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reject failed, skipped, cancelled or absent gates
        env:
          QUALITY_SCOPE_RESULT: ${{ needs.candidate-scope.result }}
          QUALITY_GATE_RESULT: ${{ needs.gates.result }}
        run: node scripts/run-quality-ci.mjs --phase final
