<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>项目交付清单 · 样板</title>
    <style data-workbench-resource="1.1.1">
      /* SHARED_THEME_RESOURCE */
    </style>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: var(--workbench-font-size, 14px)/1.7 var(--workbench-font-family, sans-serif);
      }
      main {
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35em;
        line-height: 1.35;
      }
      p {
        margin: 0;
      }
      .description,
      .summary,
      label {
        color: var(--workbench-muted);
      }
      .description {
        max-width: 70ch;
      }
      #filters {
        margin: 24px 0 16px;
      }
      fieldset {
        display: flex;
        align-items: end;
        flex-wrap: wrap;
        gap: 12px;
        padding: 0;
        margin: 0;
        border: 0;
        min-width: 0;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 0.9em;
      }
      input,
      select,
      button {
        min-height: 36px;
        max-width: 100%;
        padding: 6px 12px;
        border: 1px solid var(--workbench-control-border);
        border-radius: 8px;
        font: inherit;
        color: var(--workbench-body);
        background: var(--workbench-surface);
      }
      input {
        width: 240px;
        caret-color: var(--workbench-brand);
      }
      input::placeholder {
        color: var(--workbench-muted);
        opacity: 1;
      }
      button {
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--workbench-hover);
        border-color: var(--workbench-brand);
        color: var(--workbench-selected-text);
      }
      .primary {
        background: var(--workbench-brand);
        border-color: var(--workbench-brand);
        color: var(--workbench-surface);
      }
      .primary:hover:not(:disabled) {
        background: var(--workbench-brand-hover);
        color: var(--workbench-surface);
      }
      :disabled {
        cursor: default;
        opacity: 0.6;
      }
      :focus-visible {
        outline: 2px solid var(--workbench-brand);
        outline-offset: 2px;
      }
      ::selection {
        color: var(--workbench-text);
        background: var(--workbench-brand-soft);
      }
      .summary {
        margin-bottom: 8px;
      }
      .table-scroll {
        overflow-x: auto;
        border: 1px solid var(--workbench-border);
        border-radius: 10px;
        background: var(--workbench-surface);
        scrollbar-color: var(--workbench-control-border) var(--workbench-subtle);
      }
      table {
        width: 100%;
        min-width: 580px;
        border-collapse: collapse;
        white-space: nowrap;
      }
      caption {
        text-align: left;
        padding: 12px 16px;
        font-weight: 600;
      }
      th,
      td {
        text-align: left;
        padding: 10px 16px;
        border-bottom: 1px solid var(--workbench-border);
      }
      th {
        background: var(--workbench-muted-surface);
        color: var(--workbench-muted);
        font-size: 0.9em;
      }
      td {
        color: var(--workbench-body);
        height: 44px;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: var(--workbench-hover);
      }
      .number {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .state {
        padding: 24px 16px;
        background: var(--workbench-surface);
        border: 1px solid var(--workbench-border);
        border-radius: 10px;
      }
      .state strong {
        display: block;
        margin-bottom: 4px;
      }
      .state button {
        margin-top: 12px;
      }
      .diagnostic {
        padding: 12px 16px;
        margin: 16px 0;
        border: 1px solid var(--workbench-control-border);
      }
      [hidden] {
        display: none !important;
      }
      details {
        margin-top: 24px;
        color: var(--workbench-muted);
      }
      summary {
        cursor: pointer;
        width: fit-content;
      }
      .simulations {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      @media (max-width: 520px) {
        main {
          padding: 16px;
        }
        label {
          width: 100%;
        }
        input,
        select {
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        button {
          transition:
            background-color 160ms ease,
            border-color 160ms ease;
        }
      }
    </style>
  </head>
  <body class="agent-workbench-ui">
    <main>
      <h1>项目交付清单</h1>
      <p class="description">HTML 表格样板 · 以下均为本地演示数据，可按名称和进度筛选。</p>
      <p class="diagnostic" role="alert" id="diagnostic">正在连接工作台主题…</p>
      <section id="filters" role="search" aria-label="筛选项目">
        <fieldset disabled id="controls">
          <label
            >项目名称<input
              id="query"
              type="search"
              placeholder="输入名称或编号"
              autocomplete="off"
          /></label>
          <label
            >交付进度<select id="stage">
              <option value="">全部进度</option>
              <option>进行中</option>
              <option>已完成</option>
              <option>待开始</option>
            </select></label
          >
          <button class="primary" type="button" id="search">查询</button>
          <button type="button" id="reset">重置</button>
        </fieldset>
      </section>
      <p class="summary" id="summary" role="status" aria-live="polite"></p>
      <section id="results" aria-busy="false" aria-label="查询结果">
        <div
          class="table-scroll"
          id="table-region"
          role="region"
          aria-label="可横向滚动的交付清单"
          tabindex="0"
          hidden
        >
          <table>
            <caption>
              项目明细
            </caption>
            <thead>
              <tr>
                <th scope="col">项目编号</th>
                <th scope="col">项目名称</th>
                <th scope="col">负责人</th>
                <th scope="col">交付进度</th>
                <th scope="col" class="number">任务数</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="state" id="state" hidden>
          <strong id="state-title"></strong>
          <p id="state-description"></p>
          <button type="button" id="retry" hidden>重新查询</button>
        </div>
      </section>
      <details>
        <summary>演示状态</summary>
        <p>用于验收加载、空态与错误提示，不连接业务服务。</p>
        <div class="simulations">
          <button type="button" data-state="empty" disabled>演示空结果</button
          ><button type="button" data-state="error" disabled>演示查询失败</button>
        </div>
      </details>
    </main>
    <script type="module">
      import { createPageViewState } from '../business/shared/view-state.js';
      const sampleView = createPageViewState('workbench-html-table');
      (() => {
        const expectedVersion = '1.1.1';
        const $ = (id) => document.getElementById(id);
        const diagnostic = $('diagnostic');
        const resource = document.querySelector('style[data-workbench-resource]');
        const localVersion = resource?.getAttribute('data-workbench-resource');
        const rows = [
          ['DEMO-001', '工作台页面联调', '林晓', '进行中', 8],
          ['DEMO-002', '月度资料归档', '陈宁', '已完成', 12],
          ['DEMO-003', '帮助内容整理', '周晴', '待开始', 6],
          ['DEMO-004', '交付清单核对', '林晓', '进行中', 5],
        ];
        let timer,
          themeReady = false;
        const controls = (enabled) => {
          $('controls').disabled = !enabled;
          document
            .querySelectorAll('[data-state], #retry')
            .forEach((button) => (button.disabled = !enabled));
        };
        const stop = (message) => {
          clearTimeout(timer);
          $('results').setAttribute('aria-busy', 'false');
          themeReady = false;
          controls(false);
          diagnostic.hidden = false;
          diagnostic.textContent = message;
        };
        if (!resource || localVersion !== expectedVersion) {
          stop('共享样式资源缺失或版本不兼容，请重新构建并重新打开样板。');
          return;
        }
        const showState = (title, description, retry = false) => {
          $('table-region').hidden = true;
          $('state').hidden = false;
          $('state-title').textContent = title;
          $('state-description').textContent = description;
          $('retry').hidden = !retry;
        };
        const query = (simulation = '') => {
          if (!themeReady) return;
          clearTimeout(timer);
          $('results').setAttribute('aria-busy', 'true');
          $('summary').textContent = '正在查询…';
          showState('正在加载项目', '正在读取本地演示数据。');
          timer = setTimeout(() => {
            $('results').setAttribute('aria-busy', 'false');
            if (simulation === 'error') {
              $('summary').textContent = '查询未完成';
              showState('暂时无法读取项目', '这是演示错误；点击“重新查询”恢复本地数据。', true);
              return;
            }
            const keyword = $('query').value.trim().toLowerCase();
            const stage = $('stage').value;
            const result =
              simulation === 'empty'
                ? []
                : rows.filter(
                    (row) =>
                      (row[0] + row[1]).toLowerCase().includes(keyword) &&
                      (!stage || row[3] === stage),
                  );
            $('summary').textContent = '共 ' + result.length + ' 个项目';
            $('rows').replaceChildren(
              ...result.map((row) => {
                const tr = document.createElement('tr');
                row.forEach((value, index) => {
                  const td = document.createElement('td');
                  td.textContent = value;
                  if (index === 4) td.className = 'number';
                  tr.append(td);
                });
                return tr;
              }),
            );
            $('table-region').hidden = !result.length;
            $('state').hidden = !!result.length;
            if (!result.length) showState('没有匹配的项目', '试试其他名称或进度，也可以重置筛选。');
          }, 350);
        };
        const saveView = () =>
          sampleView.update({ keyword: $('query').value, stage: $('stage').value });
        sampleView.subscribe((value) => {
          if (typeof value.keyword === 'string') $('query').value = value.keyword;
          if (['', '进行中', '已完成', '待开始'].includes(value.stage))
            $('stage').value = value.stage;
          query();
        });
        $('query').addEventListener('input', saveView);
        $('stage').addEventListener('change', saveView);
        $('search').onclick = () => {
          saveView();
          query();
        };
        $('query').addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            query();
          }
        });
        $('reset').onclick = () => {
          $('query').value = '';
          $('stage').value = '';
          saveView();
          query();
        };
        $('retry').onclick = () => query();
        document
          .querySelectorAll('[data-state]')
          .forEach((button) => (button.onclick = () => query(button.dataset.state)));
        const projectTheme = (event) => {
          if (event.source !== parent || event.data?.protocol !== 'agent-workbench-theme') return;
          const value = event.data;
          if (!Number.isFinite(value.fontSize)) return;
          document.body.style.setProperty('--dsh-content-font-size', `${value.fontSize}px`);
          document.documentElement.style.colorScheme = value.dark ? 'dark' : 'light';
          document.body.toggleAttribute('data-ds-dark-theme', value.dark === true);
        };
        addEventListener('message', projectTheme);
        addEventListener(
          'pagehide',
          () => {
            clearTimeout(timer);
            removeEventListener('message', projectTheme);
          },
          { once: true },
        );
        themeReady = true;
        diagnostic.hidden = true;
        controls(true);
        query();
      })();
    </script>
  </body>
</html>
