<style>

body{margin:0;background:#f5f6f7;color:#34383e;font:16px/1.7 system-ui,sans-serif}main{max-width:700px;margin:24px auto;background:white;padding:24px;border-radius:12px}h1{font-size:22px;margin:0 0 18px}#summary{white-space:pre-line;color:#555}article{padding:16px 0;border-bottom:1px solid #e5e6eb}article p{margin:4px 0;color:#666}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px;border-top:1px solid #e5e6eb;padding-top:18px}button,select{font:inherit;border:1px solid #c9cdd4;border-radius:8px;background:white;padding:8px 20px}button{cursor:pointer}button.primary{color:#fff;background:#245bdb;border-color:#245bdb}button:disabled{opacity:.5;cursor:default}#notice{color:#d33;min-height:1.7em}#result{padding:12px;background:#f0f7ff;color:#245bdb}small{color:#86909c}label{display:block;margin:18px 0}#quantity{font-weight:600}@media(max-width:500px){main{margin:0;padding:20px;border-radius:0}.actions button{flex:1;min-width:0}select{width:100%;margin-top:8px}}

<main id="confirmationMain"><h1 id="title">订单销售确认</h1><p id="summary"></p><section id="items" hidden></section>

<p id="quantity"></p><p id="notice" role="alert"></p><p id="result" role="status" hidden></p>
<nav id="pages" hidden><button id="previous">上一页</button> <span id="pageLabel"></span> <button id="next">下一页</button></nav>
<small>本次只登记销售处理决定，实际开单、发货及改单由业务系统执行。</small>
<div class="actions"><button id="cancel">取消</button><button class="primary" id="submit" disabled>确认</button></div></main>
